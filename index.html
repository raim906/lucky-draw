<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><link rel="manifest" href="manifest.webmanifest"><title>লাকি ড্র</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font-family:system-ui,sans-serif}main{max-width:600px;margin:auto;padding:16px}.hero,.card{border-radius:18px;padding:18px;margin:12px 0}.hero{background:linear-gradient(135deg,#172554,#1d4ed8);color:white;text-align:center}.card{background:white;box-shadow:0 4px 18px #0001}textarea,input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;font-size:16px}textarea{height:130px}label{display:block;font-weight:bold;margin:12px 0 6px}button{border:0;border-radius:12px;padding:13px;font:inherit;font-weight:bold}.primary{width:100%;background:#1d4ed8;color:white;margin-top:12px}.secondary{background:#e2e8f0;flex:1}.danger{background:#fee2e2}.wheelwrap{position:relative;display:flex;justify-content:center;margin:24px auto}.wheel{position:relative;width:min(78vw,330px);height:min(78vw,330px);border:8px solid #172554;border-radius:50%;display:grid;place-items:center;transition:transform 4s cubic-bezier(.12,.75,.12,1);box-shadow:0 8px 20px #0003}.wheel span{z-index:3;background:white;border:3px solid #172554;border-radius:50%;padding:13px;font-weight:900}.wheel-label{position:absolute;z-index:2;width:30%;text-align:center;font-size:clamp(10px,2.7vw,14px);font-weight:bold;color:white;text-shadow:0 1px 3px black;overflow-wrap:anywhere;line-height:1.1;transform:translate(-50%,-50%)}.pointer{position:absolute;top:-18px;z-index:4;color:#dc2626;font-size:30px}.result{text-align:center;color:#047857;font-size:24px;font-weight:900;overflow-wrap:anywhere}.muted{font-size:13px;color:#64748b}.row{display:flex;gap:8px}.row>*{flex:1}li{margin:7px 0}
</style><body><main><header class="hero"><h1>🎡 লাকি ড্র</h1>আপনার নিজের বাংলা লটারি নির্বাচন অ্যাপ</header>
<section class="card"><label>অংশগ্রহণকারীদের নাম</label><textarea id="names" placeholder="প্রতি লাইনে একজনের নাম লিখুন"></textarea><p class="muted">প্রতি লাইনে একটি নাম লিখুন; কমা বা সেমিকোলন দিয়েও আলাদা করতে পারবেন। একই নাম একবারই গণনা হবে।</p><label>কতজন বিজয়ী?</label><input id="count" type="number" min="1" value="1"><div class="wheelwrap"><div class="pointer">▼</div><div class="wheel" id="wheel"><div id="labels"></div><span>শুভকামনা!</span></div></div><button class="primary" id="draw">🎯 লটারি শুরু করুন</button><p class="muted" id="msg" style="text-align:center"></p></section>
<section class="card"><h2>🏆 বিজয়ী</h2><div class="result" id="winner">এখনো নির্বাচন হয়নি</div><p class="muted" id="remain" style="text-align:center"></p><div class="row"><button class="secondary" id="remove" disabled>বিজয়ীদের বাদ দিন</button><button class="secondary" id="reset">ফলাফল মুছুন</button></div></section>
<section class="card"><h3>আগের ফলাফল</h3><ol id="history"></ol><button class="danger" id="clear">ইতিহাস মুছুন</button></section><p class="muted" style="text-align:center">ডেটা এই ডিভাইসে সংরক্ষিত থাকে।</p></main>
<script>
const $=id=>document.getElementById(id);let winners=[],remaining=[],turn=0;const colors=['#f59e0b','#2563eb','#10b981','#ec4899','#8b5cf6','#06b6d4','#f97316','#84cc16','#e11d48','#0f766e'];
function getNames(){return [...new Set($('names').value.split(/[\n,;]+/).map(v=>v.trim()).filter(Boolean))]}
function wheelPaint(a){$('labels').innerHTML='';if(!a.length){$('wheel').style.background='#64748b';return}let step=360/a.length;$('wheel').style.background='conic-gradient('+a.map((v,i)=>`${colors[i%colors.length]} ${i*step}deg ${(i+1)*step}deg`).join(',')+')';a.forEach((v,i)=>{let angle=((i+.5)*step-90)*Math.PI/180,e=document.createElement('div');e.className='wheel-label';e.textContent=v;e.style.left=(50+34*Math.cos(angle))+'%';e.style.top=(50+34*Math.sin(angle))+'%';$('labels').appendChild(e)})}
function history(){let h=JSON.parse(localStorage.getItem('ld_h')||'[]');$('history').innerHTML=h.map(v=>'<li>'+v+'</li>').join('')||'<li>কোনো ফলাফল নেই</li>'}
$('names').addEventListener('input',()=>wheelPaint(getNames()));
$('draw').onclick=()=>{let a=getNames(),n=Number($('count').value);if(!a.length){$('msg').textContent='আগে নাম লিখুন।';return}if(!Number.isInteger(n)||n<1||n>a.length){$('msg').textContent=`১ থেকে ${a.length} জনের মধ্যে বিজয়ীর সংখ্যা দিন।`;return}let pool=[...a];winners=[];for(let i=0;i<n;i++){let k=Math.floor(Math.random()*pool.length);winners.push(pool.splice(k,1)[0])}remaining=pool;turn+=1440+Math.floor(Math.random()*720);$('wheel').style.transform=`rotate(${turn}deg)`;$('winner').textContent=winners.join(' • ');$('remain').textContent=`মোট ${a.length} জনের মধ্যে বিজয়ী ${winners.length} জন; অবশিষ্ট ${pool.length} জন`;$('msg').textContent='ড্র সম্পন্ন হয়েছে';$('remove').disabled=false;let h=JSON.parse(localStorage.getItem('ld_h')||'[]');h.unshift(new Date().toLocaleString('bn-BD')+' — '+winners.join(', '));localStorage.setItem('ld_h',JSON.stringify(h.slice(0,50)));history()};
$('remove').onclick=()=>{if(winners.length){$('names').value=remaining.join('\n');wheelPaint(remaining);$('winner').textContent='বিজয়ীদের বাদ দেওয়া হয়েছে';$('remain').textContent='';winners=[];$('remove').disabled=true}};
$('reset').onclick=()=>{$('winner').textContent='এখনো নির্বাচন হয়নি';$('remain').textContent='';$('msg').textContent='';winners=[];$('remove').disabled=true};
$('clear').onclick=()=>{localStorage.removeItem('ld_h');history()};wheelPaint(getNames());history();
</script></body></html>
